# Clio — allowlist vhost. Only paths with a known caller are published.
# /status, /capture/bulk, /capture/fix, /capture/fix/recent stay closed.
#
# ⚠ PRE-CERTBOT TEMPLATE — reapplying this over the live config is DESTRUCTIVE,
# and worse here than for formava. This file has `listen 80` only, and every
# proxying location below sits inside that plaintext block. Uploading it to a
# host whose live config already has certbot's 443 block therefore does two
# things at once: it removes TLS, and it republishes the capture path over
# cleartext -- putting the bearer token back on the wire across cellular
# networks, which is the exact exposure §3.1 exists to close. nginx starts
# cleanly either way, so nothing announces it. This has happened once already
# (Task 6, recovered by hand).
#
# Reapply ONLY as part of a rebuild that re-runs certbot immediately afterwards.
# Then confirm with `nginx -T` that the 443 listener is back and that no
# proxy_pass to Clio remains reachable over port 80.
limit_req_zone $binary_remote_addr zone=capture:1m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=sessions:1m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name clio.lantzbuilds.com;

    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Clio's own app (helmet) sends `includeSubDomains`, which is not wanted
    # on this shared personal domain (other hosts live under lantzbuilds.com).
    # Override rather than trust the upstream value.
    #
    # Both lines are load-bearing and must stay together: proxy_hide_header
    # strips Clio's version, add_header supplies ours. Drop the first and the
    # upstream value returns; drop the second and §5.3's HSTS requirement is
    # unmet.
    #
    # The constraint is no `includeSubDomains` and no `preload`. Either one
    # would bind EVERY host under lantzbuilds.com to HTTPS-only, including
    # hosts this repo knows nothing about, and browsers honour it from cache
    # for the full max-age -- so the mistake cannot be rolled back by fixing
    # nginx. `preload` is worse still: removal from the browser preload list
    # takes months. verify.sh asserts this header on every run precisely
    # because the failure is irreversible and otherwise invisible.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # iOS Shortcut — new capture
    location = /capture {
        limit_except POST { deny all; }
        limit_req zone=capture burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # iOS Shortcut — correct an existing capture by id.
    # Regex because an exact match cannot cover a path parameter. Anchored to
    # exactly three segments so /capture/fix and /capture/fix/recent do NOT
    # match and stay closed. nginx evaluates regex locations before plain
    # prefix matches, so `location /` never sees this.
    location ~ ^/capture/[^/]+/fix$ {
        limit_except POST { deny all; }
        limit_req zone=capture burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # CLI connection validation
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # CLI session control. SSE settings are load-bearing: with nginx's
    # default proxy_buffering the chat stream is buffered and typewriter
    # rendering breaks, and the default 60s read timeout severs long turns.
    location /api/sessions {
        limit_req zone=sessions burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection      '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}
