# Match the credential-harvesting and fingerprinting probes this host actually
# receives. Installed to /etc/fail2ban/filter.d/web-probes.conf.
#
# Why this exists: spec §3.2 justified the nginx-badbots jail by naming the
# `zgrab/0.x` user agent and `GET /SDK/webLanguage`. That jail is aliased to the
# stock nginx-botsearch filter, whose block list is roundcube / horde / pma /
# phpMyAdmin / wp-*.php / cgi-bin -- it matches NEITHER of the two threats the
# spec names, and neither the /.env nor /.git/config probes that are by volume
# the most common attack traffic on this box. nginx-botsearch is still enabled
# and does catch WordPress and phpMyAdmin sweeps; this filter covers the rest.
#
# Patterns are drawn from real entries in this host's access.log, not guessed:
#   45.33.12.122 - - [...] "GET / HTTP/1.1" 200 409 "-" "Mozilla/5.0 zgrab/0.x"
#   5.61.209.92  - - [...] "GET /SDK/webLanguage HTTP/1.1" 404 196 "-" "..."
#
# The datepattern omits the surrounding brackets for the same reason as
# clio-capture-auth: fail2ban's date detector strips whatever it matches,
# brackets included, so failregex must match the empty `[]` left behind.
# Verified with fail2ban-regex against the live log.
[Definition]

# Any request carrying a scanner user agent, whatever it asks for. zgrab probes
# `/` as often as anything else, so keying on the path would miss most of them.
badagents = zgrab|masscan|nuclei|sqlmap|WPScan

# Paths that have no legitimate caller here. `.env` and `.git/config` are
# credential theft; `/SDK/webLanguage` is Dahua device fingerprinting.
probepaths = /\.env|/\.git/|/SDK/webLanguage|/vendor/phpunit|/config\.json|/\.aws/

failregex = ^<HOST> - \S+ \[\] "[A-Z]+ [^"]*(?:%(probepaths)s)[^"]*" \d+ .*$
            ^<HOST> - \S+ \[\] "[A-Z]+ [^"]*" \d+ \d+ "[^"]*" "[^"]*(?:%(badagents)s)[^"]*"$

ignoreregex =
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
